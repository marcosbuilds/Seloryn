[package]
name = "seloryn"
version = "0.9.2"
edition = "2024"
publish = false
description = "Seloryn language bootstrap CLI"
license = "MIT"
default-run = "seloryn"

[package.metadata.seloryn]
language-version = "0.09"
status = "verified-preview"

[dependencies]
sha2 = "0.10"
hmac = "0.12"
unicode-ident = "1.0"
unicode-normalization = "0.1"
pollster = "1.0.1"
toml = "0.9"
wgpu = "30.0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[[bin]]
name = "seloryn"
path = "src/main.rs"
