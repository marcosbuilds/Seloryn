[package]
name = "seloryn"
version = "0.12.0"
edition = "2024"
publish = false
description = "Seloryn language bootstrap CLI"
license = "MIT"
default-run = "seloryn"

[package.metadata.seloryn]
language-version = "0.12"
status = "verified-preview"

[dependencies]
sha2 = "0.10"
hmac = "0.12"
unicode-ident = "1.0"
unicode-normalization = "0.1"
pollster = "1.0.1"
toml = "0.9"
wgpu = "30.0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_GdiPlus", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Diagnostics_Debug", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }

[[bin]]
name = "seloryn"
path = "src/main.rs"
