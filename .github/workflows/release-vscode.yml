name: Release verified-preview VS Code extension

on:
  push:
    tags:
      - 'vscode-v*'

permissions:
  contents: write

jobs:
  release:
    name: Package and publish VS Code extension
    runs-on: ubuntu-24.04
    environment: release-approval
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tooling/vscode/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Release script dependencies
        run: python -m pip install --disable-pip-version-check --quiet -r scripts/release/requirements.txt
      - name: Verify earned version comparison
        run: python scripts/release/verify-version.py
      - name: Install extension dependencies
        run: npm ci --prefix tooling/vscode --ignore-scripts --no-audit --no-fund
      - name: Build deterministic VSIX
        run: npm run package --prefix tooling/vscode
      - name: Verify tag and artifact version
        shell: bash
        run: |
          VERSION=$(node -p "require('./tooling/vscode/package.json').version")
          test "${GITHUB_REF_NAME}" = "vscode-v${VERSION}"
          test -f "tooling/vscode/seloryn-language-${VERSION}.vsix"
      - name: Create artifact checksums
        shell: bash
        run: |
          VERSION=$(node -p "require('./tooling/vscode/package.json').version")
          sha256sum "tooling/vscode/seloryn-language-${VERSION}.vsix" > "tooling/vscode/SHA256SUMS"
      - name: Publish verified-preview GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./tooling/vscode/package.json').version")
          gh release create "${GITHUB_REF_NAME}" \
            "tooling/vscode/seloryn-language-${VERSION}.vsix" \
            "tooling/vscode/SHA256SUMS" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Seloryn Language for VS Code ${VERSION}" \
            --notes-file "docs/releases/vscode-${VERSION}.md" \
            --prerelease \
            --latest=false
