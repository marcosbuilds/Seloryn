name: Verify Seloryn

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Rust and public gates / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rust toolchain
        run: rustup show active-toolchain
      - name: Toolchain details
        run: |
          rustc --version
          cargo --version
          python --version
      - name: Release script dependencies
        run: python -m pip install --disable-pip-version-check --quiet -r scripts/release/requirements.txt
      - name: Verify earned version comparison
        run: python scripts/release/verify-version.py
      - name: Format
        run: cargo fmt --all -- --check
      - name: Rust tests (all targets)
        # Tensor allocation-budget tests share a process-wide accounting
        # counter. Run tests serially so their result cannot depend on the
        # Rust harness scheduling unrelated allocations concurrently.
        run: cargo test --all-targets --locked -- --test-threads=1
      - name: Clippy (warnings fail)
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Release tests
        run: cargo test --release --all-targets --locked -- --test-threads=1
      - name: Release build
        run: cargo build --release --locked
      - name: CI evidence helper contract
        run: >
          python scripts/ci/ci_evidence.py run
          --output-dir .ci-evidence
          --name ci-evidence-helper
          --kind test
          --
          python tests/ci_evidence_probe.py
      - name: Build previous release performance baseline
        shell: pwsh
        run: |
          $baselineRoot = Join-Path $env:RUNNER_TEMP 'seloryn-performance-baseline'
          if (Test-Path -LiteralPath $baselineRoot) {
            Remove-Item -LiteralPath $baselineRoot -Recurse -Force
          }
          git worktree add --detach $baselineRoot HEAD^
          if ($LASTEXITCODE -ne 0) { throw 'failed to create previous-release worktree' }
          cargo build --release --locked --manifest-path (Join-Path $baselineRoot 'Cargo.toml')
          if ($LASTEXITCODE -ne 0) { throw 'failed to build previous-release performance baseline' }
          $binaryName = if ($IsWindows) { 'seloryn.exe' } else { 'seloryn' }
          $baselineBinary = Join-Path $baselineRoot ('target/release/' + $binaryName)
          if (-not (Test-Path -LiteralPath $baselineBinary -PathType Leaf)) { throw "baseline binary missing: $baselineBinary" }
          "SELORYN_BASELINE_BINARY=$baselineBinary" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Validate public conformance matrix
        run: python scripts/ci/conformance.py --validate
      - name: Run public core conformance matrix
        run: python scripts/ci/conformance.py --run --suite core
      - name: Validate benchmark suite contracts
        run: python benchmarks/test_benchmark_contracts.py
      - name: Run reproducible benchmark suite (advisory)
        continue-on-error: true
        run: python benchmarks/runner.py --samples 3 --warmup 1 --timeout 60
      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seloryn-benchmark-report-${{ matrix.os }}
          path: |
            benchmarks/reports/latest.json
            benchmarks/reports/latest.md
          if-no-files-found: error
          retention-days: 30
      - name: Independent N1 CLI comparison
        run: >
          python scripts/ci/ci_evidence.py run
          --output-dir .ci-evidence
          --name n1-cli
          --kind probe
          --
          python tests/n1_probe.py
      - name: Independent N2 CLI comparison
        run: >
          python scripts/ci/ci_evidence.py run
          --output-dir .ci-evidence
          --name n2-cli
          --kind probe
          --
          python tests/n2_probe.py
      - name: Independent N3a CLI comparison
        run: >
          python scripts/ci/ci_evidence.py run
          --output-dir .ci-evidence
          --name n3a-cli
          --kind probe
          --
          python tests/n3_probe.py
      - name: Independent N3b tensor autograd comparison
        run: >
          python scripts/ci/ci_evidence.py run
          --output-dir .ci-evidence
          --name n3b-tensor
          --kind probe
          --
          python tests/n3_tensor_probe.py
      - name: Public projects and bundle probe
        run: >
          python scripts/ci/ci_evidence.py run
          --output-dir .ci-evidence
          --name public-projects
          --kind probe
          --
          python tests/release_probe.py
      - name: Independent project manifest probe
        run: >
          python scripts/ci/ci_evidence.py run
          --output-dir .ci-evidence
          --name project-manifest
          --kind probe
          --
          python tests/project_manifest_probe.py
      - name: Independent local import contract probe
        run: >
          python scripts/ci/ci_evidence.py run
          --output-dir .ci-evidence
          --name local-import
          --kind probe
          --
          python tests/import_contract_probe.py
      - name: Independent CPU MLP training proof
        run: >
          python scripts/ci/ci_evidence.py run
          --output-dir .ci-evidence
          --name cpu-mlp-training
          --kind probe
          --
          python tests/mlp_training_probe.py
      - name: Independent hash-chained training stream proof
        run: >
          python scripts/ci/ci_evidence.py run
          --output-dir .ci-evidence
          --name training-stream
          --kind probe
          --
          python tests/streaming_v2_probe.py
      - name: Independent Seloryn-authored training proof
        run: >
          python scripts/ci/ci_evidence.py run
          --output-dir .ci-evidence
          --name self-hosted-mlp
          --kind probe
          --
          python tests/self_hosted_probe.py
      - name: Independent self-hosted language-model proof
        run: >
          python scripts/ci/ci_evidence.py run
          --output-dir .ci-evidence
          --name self-hosted-language-model
          --kind probe
          --
          python tests/self_hosted_language_model_probe.py
      - name: Independent auditable local-inference proof
        run: >
          python scripts/ci/ci_evidence.py run
          --output-dir .ci-evidence
          --name auditable-local-inference
          --kind probe
          --
          python tests/auditable_local_inference_probe.py
      - name: Reproducible source-owned performance benchmark
        shell: pwsh
        # Shared runners are suitable for collecting comparable evidence, but
        # not for a hard five-sample performance gate. Functional correctness
        # remains blocking; performance promotion requires a controlled review.
        run: >
          python scripts/ci/ci_evidence.py run
          --output-dir .ci-evidence
          --name performance
          --kind benchmark
          --
          python tests/performance_probe.py
          --baseline "$env:SELORYN_BASELINE_BINARY"
          --runs 5
      - name: Operational reliability and workspace confinement proof
        run: >
          python scripts/ci/ci_evidence.py run
          --output-dir .ci-evidence
          --name operational-reliability
          --kind probe
          --
          python tests/operational_reliability_probe.py
      - name: Job lifecycle contract proof
        run: >
          python scripts/ci/ci_evidence.py run
          --output-dir .ci-evidence
          --name job-lifecycle
          --kind probe
          --
          python tests/job_lifecycle_probe.py
      - name: Job lease contract proof
        run: >
          python scripts/ci/ci_evidence.py run
          --output-dir .ci-evidence
          --name job-lease
          --kind probe
          --
          python tests/job_lease_probe.py
      - name: Job recovery contract proof
        run: >
          python scripts/ci/ci_evidence.py run
          --output-dir .ci-evidence
          --name job-recovery
          --kind probe
          --
          python tests/job_recovery_probe.py
      - name: Job concurrency contract proof
        run: >
          python scripts/ci/ci_evidence.py run
          --output-dir .ci-evidence
          --name job-concurrency
          --kind probe
          --
          python tests/job_concurrency_probe.py
      - name: Job preflight contract proof
        run: >
          python scripts/ci/ci_evidence.py run
          --output-dir .ci-evidence
          --name job-preflight
          --kind probe
          --
          python tests/job_preflight_probe.py
      - name: Job worker execution proof
        run: >
          python scripts/ci/ci_evidence.py run
          --output-dir .ci-evidence
          --name job-worker
          --kind probe
          --
          python tests/job_worker_probe.py
      - name: Python/Seloryn language-model comparison
        run: >
          python scripts/ci/ci_evidence.py run
          --output-dir .ci-evidence
          --name language-model-comparison
          --kind probe
          --
          python tests/compare_language_model.py
      - name: GPU compute probe when an adapter exists
        run: >
          python scripts/ci/ci_evidence.py run
          --output-dir .ci-evidence
          --name gpu-compute
          --kind probe
          --
          python tests/gpu_probe.py
      - name: GPU linear training proof when an adapter exists
        run: >
          python scripts/ci/ci_evidence.py run
          --output-dir .ci-evidence
          --name gpu-training
          --kind probe
          --
          python tests/gpu_training_probe.py
      - name: Install VS Code packaging dependencies
        run: npm ci --prefix packages/vscode --ignore-scripts --no-audit --no-fund
      - name: Build deterministic VSIX preview
        run: npm run package --prefix packages/vscode
      - name: VS Code extension and CLI diagnostic integration
        run: npm run test:cli --prefix packages/vscode
      - name: VS Code extension metadata and API-double tests
        run: npm test --prefix packages/vscode
      - name: PowerShell 5.1 CLI smoke
        if: runner.os == 'Windows'
        shell: powershell
        run: '& .\target\release\seloryn.exe run examples\tensors\tensor-matmul.sely'
      - name: PowerShell 7 CLI smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& .\target\release\seloryn.exe run examples\tensors\tensor-matmul.sely'
      - name: CMD CLI smoke
        if: runner.os == 'Windows'
        shell: cmd
        run: target\release\seloryn.exe run examples\tensors\tensor-matmul.sely
      - name: PowerShell 5.1 failure exit smoke
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & .\target\release\seloryn.exe run tests\result-error.sely
          if ($LASTEXITCODE -ne 65) { throw "expected Seloryn failure exit code 65, got $LASTEXITCODE" }
          exit 0
      - name: PowerShell 7 failure exit smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & .\target\release\seloryn.exe run tests\result-error.sely
          if ($LASTEXITCODE -ne 65) { throw "expected Seloryn failure exit code 65, got $LASTEXITCODE" }
          exit 0
      - name: CMD failure exit smoke
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          target\release\seloryn.exe run tests\result-error.sely
          rem CMD expands %ERRORLEVEL% before the executable runs inside this block.
          rem Use post-execution ERRORLEVEL tests so the smoke checks the real exit code.
          if errorlevel 66 exit /b 1
          if not errorlevel 65 exit /b 1
          exit /b 0
      - name: Windows installer and terminal lifecycle
        if: runner.os == 'Windows'
        shell: powershell
        run: .\tests\installer_probe.ps1
      - name: Finalize sanitized CI evidence
        if: always()
        run: >
          python scripts/ci/ci_evidence.py finalize
          --output-dir .ci-evidence
          --expected ci-evidence-helper n1-cli n2-cli n3a-cli n3b-tensor
          public-projects project-manifest local-import cpu-mlp-training
          training-stream self-hosted-mlp self-hosted-language-model
          auditable-local-inference performance operational-reliability
          job-lifecycle job-lease job-recovery job-concurrency job-preflight job-worker
          language-model-comparison gpu-compute gpu-training
      - name: Upload sanitized CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seloryn-ci-evidence-${{ matrix.os }}
          path: .ci-evidence
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
