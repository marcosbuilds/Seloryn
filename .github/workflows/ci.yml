name: Verify Seloryn

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Rust and public gates / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rust toolchain
        run: rustup show active-toolchain
      - name: Toolchain details
        run: |
          rustc --version
          cargo --version
          python --version
      - name: Release script dependencies
        run: python -m pip install --disable-pip-version-check --quiet -r scripts/release/requirements.txt
      - name: Verify earned version comparison
        run: python scripts/release/verify-version.py
      - name: Format
        run: cargo fmt --all -- --check
      - name: Rust tests (all targets)
        # Tensor allocation-budget tests share a process-wide accounting
        # counter. Run tests serially so their result cannot depend on the
        # Rust harness scheduling unrelated allocations concurrently.
        run: cargo test --all-targets --locked -- --test-threads=1
      - name: Clippy (warnings fail)
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Release tests
        run: cargo test --release --all-targets --locked -- --test-threads=1
      - name: Release build
        run: cargo build --release --locked
      - name: Build previous release performance baseline
        shell: pwsh
        run: |
          $baselineRoot = Join-Path $env:RUNNER_TEMP 'seloryn-performance-baseline'
          if (Test-Path -LiteralPath $baselineRoot) {
            Remove-Item -LiteralPath $baselineRoot -Recurse -Force
          }
          git worktree add --detach $baselineRoot HEAD^
          if ($LASTEXITCODE -ne 0) { throw 'failed to create previous-release worktree' }
          cargo build --release --locked --manifest-path (Join-Path $baselineRoot 'Cargo.toml')
          if ($LASTEXITCODE -ne 0) { throw 'failed to build previous-release performance baseline' }
          $binaryName = if ($IsWindows) { 'seloryn.exe' } else { 'seloryn' }
          $baselineBinary = Join-Path $baselineRoot ('target/release/' + $binaryName)
          if (-not (Test-Path -LiteralPath $baselineBinary -PathType Leaf)) { throw "baseline binary missing: $baselineBinary" }
          "SELORYN_BASELINE_BINARY=$baselineBinary" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Portable public conformance matrix
        run: python scripts/ci/conformance.py --run --suite core
      - name: Reproducible source-owned performance benchmark
        shell: pwsh
        # Shared runners are suitable for collecting comparable evidence, but
        # not for a hard five-sample performance gate. Functional correctness
        # remains blocking; performance promotion requires a controlled review.
        run: python tests/performance_probe.py --baseline $env:SELORYN_BASELINE_BINARY --runs 5
      - name: Hardware conformance matrix when an adapter exists
        run: python scripts/ci/conformance.py --run --suite hardware
      - name: Install VS Code packaging dependencies
        run: npm ci --prefix tooling/vscode --ignore-scripts --no-audit --no-fund
      - name: Editor conformance matrix
        run: python scripts/ci/conformance.py --run --suite editor
      - name: Release and installer conformance matrix
        run: python scripts/ci/conformance.py --run --suite release
      - name: PowerShell 5.1 CLI smoke
        if: runner.os == 'Windows'
        shell: powershell
        run: '& .\target\release\seloryn.exe run examples\tensors\tensor-matmul.sely'
      - name: PowerShell 7 CLI smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& .\target\release\seloryn.exe run examples\tensors\tensor-matmul.sely'
      - name: CMD CLI smoke
        if: runner.os == 'Windows'
        shell: cmd
        run: target\release\seloryn.exe run examples\tensors\tensor-matmul.sely
      - name: PowerShell 5.1 failure exit smoke
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & .\target\release\seloryn.exe run tests\result-error.sely
          if ($LASTEXITCODE -ne 65) { throw "expected Seloryn failure exit code 65, got $LASTEXITCODE" }
          exit 0
      - name: PowerShell 7 failure exit smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & .\target\release\seloryn.exe run tests\result-error.sely
          if ($LASTEXITCODE -ne 65) { throw "expected Seloryn failure exit code 65, got $LASTEXITCODE" }
          exit 0
      - name: CMD failure exit smoke
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          target\release\seloryn.exe run tests\result-error.sely
          rem CMD expands %ERRORLEVEL% before the executable runs inside this block.
          rem Use post-execution ERRORLEVEL tests so the smoke checks the real exit code.
          if errorlevel 66 exit /b 1
          if not errorlevel 65 exit /b 1
          exit /b 0
