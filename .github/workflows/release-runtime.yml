name: Release Seloryn runtime preview

on:
  push:
    tags:
      - 'seloryn-v*'

permissions:
  contents: read

jobs:
  package:
    name: Package runtime / ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x64
            binary: target/release/seloryn.exe
          - os: ubuntu-24.04
            platform: linux-x64
            binary: target/release/seloryn
          - os: macos-15
            platform: macos-arm64
            binary: target/release/seloryn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Release script dependencies
        run: python -m pip install --disable-pip-version-check --quiet -r scripts/release/requirements.txt
      - name: Verify release version and tag
        shell: bash
        run: |
          python scripts/release/verify-version.py
          language_version=$(python -c 'import tomllib; print(tomllib.load(open("VERSION.toml", "rb"))["current"]["language"])')
          runtime_version=$(python -c 'import tomllib; print(tomllib.load(open("VERSION.toml", "rb"))["current"]["runtime_package"])')
          test "${GITHUB_REF_NAME}" = "seloryn-v${language_version}"
      - name: Build release runtime
        run: cargo build --release --locked
      - name: Run release project and manifest evidence
        run: |
          python tests/release_probe.py
          python tests/project_manifest_probe.py
          python tests/streaming_v2_probe.py
          python tests/gpu_training_probe.py
          python tests/self_hosted_language_model_probe.py
          python tests/compare_language_model.py
      - name: Windows installer and terminal lifecycle
        if: runner.os == 'Windows'
        shell: powershell
        run: .\tests\installer_probe.ps1
      - name: Read package versions
        id: versions
        shell: bash
        run: |
          echo "language=$(python -c 'import tomllib; print(tomllib.load(open("VERSION.toml", "rb"))["current"]["language"])')" >> "$GITHUB_OUTPUT"
          echo "runtime=$(python -c 'import tomllib; print(tomllib.load(open("VERSION.toml", "rb"))["current"]["runtime_package"])')" >> "$GITHUB_OUTPUT"
      - name: Package deterministic runtime archive
        shell: bash
        run: |
          python scripts/release/package-runtime.py \
            --binary "${{ matrix.binary }}" \
            --output-dir dist \
            --platform "${{ matrix.platform }}" \
            --runtime-version "${{ steps.versions.outputs.runtime }}" \
            --language-version "${{ steps.versions.outputs.language }}" \
            --commit "${GITHUB_SHA}"
      - uses: actions/upload-artifact@v4
        with:
          name: seloryn-runtime-${{ matrix.platform }}
          path: dist/*.zip
          if-no-files-found: error

  publish:
    name: Publish runtime preview
    needs: package
    runs-on: ubuntu-24.04
    environment: release-approval
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: seloryn-runtime-*
          merge-multiple: true
      - name: Create checksums
        run: sha256sum dist/*.zip | sort > dist/SHA256SUMS
      - name: Publish immutable runtime preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          language_version=$(python -c 'import tomllib; print(tomllib.load(open("VERSION.toml", "rb"))["current"]["language"])')
          runtime_version=$(python -c 'import tomllib; print(tomllib.load(open("VERSION.toml", "rb"))["current"]["runtime_package"])')
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.zip dist/SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Seloryn runtime ${runtime_version}" \
            --notes-file "docs/releases/runtime-${language_version}.md" \
            --prerelease \
            --latest=false
